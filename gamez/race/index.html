<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PlaysGamez – Neon Racer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../styles/style_main.css">
</head>

<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">⟵ Zurück zur Startseite</a>
        <h1 id="title">Neon<span>Racer</span></h1>
        <p class="tagline">Rase durch den Verkehr und überlebe</p>
    </header>

    <canvas id="gameCanvas" width="540" height="760"></canvas>

    <p id="hint">← → Steuern · ↑ Nitro · ↓ Bremse · P Pause · R Neustart</p>

    <div id="controls">
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
    </div>

    <!-- Touch-Steuerung (nur auf kleinen Displays / Touch-Geräten sichtbar) -->
    <div id="touchControls">
        <button data-action="left" aria-label="Nach links">◀</button>
        <button data-action="boost" aria-label="Nitro">⚡ Nitro</button>
        <button data-action="right" aria-label="Nach rechts">▶</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
