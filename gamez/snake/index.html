<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaysGamez – Neon Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">⟵ Zurück zur Startseite</a>
        <h1 id="title">Neon<span>Snake</span></h1>
        <p class="tagline">Klassische Schlange – fress die Punkte und werde länger</p>
    </header>

    <div id="scoreBar">
        <span id="score">Score: 0</span>
        <span id="best">Best: 0</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hint">Pfeiltasten oder WASD zum Steuern · <b>R</b> = Neustart</div>

    <div id="controls"><button id="restartBtn">Neustart</button></div>

    <!-- On-Screen D-Pad für Touch-Geräte -->
    <div id="dpad">
        <button data-dir="up">▲</button>
        <div class="dpad-row">
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
