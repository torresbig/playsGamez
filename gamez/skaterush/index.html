<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PlaysGamez – Skate Rush</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../styles/style_main.css">
</head>
<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">⟵ Zurück zur Startseite</a>
        <h1 id="title">Skate<span>rush</span></h1>
        <p class="tagline">Endloslauf – tippe zum Springen über Hindernisse!</p>
    </header>

    <div id="scoreBar">
        <span id="score">Distanz: 0 m</span>
        <span id="best">Best: 0 m</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hint">👆 Tippe zum Springen · Doppel-Tipp = höher · <b>R</b> = Neustart</div>

    <div id="controls"><button id="restartBtn">Neustart</button></div>

    <script src="game.js"></script>
</body>
</html>
