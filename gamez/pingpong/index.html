<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PlaysGamez – Pong</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../styles/style_main.css">
</head>

<body>
    <header class="game-header">
        <a href="../../index.html" class="back-btn">⟵ Zurück zur Startseite</a>
        <h1 id="title">Ping<span>Pong</span></h1>
        <p class="tagline">Klassisches Pong-Duell gegen die KI</p>
    </header>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="controls">
        <div id="difficultyContainer">
            <button id="easyBtn">Easy</button>
            <button id="normalBtn">Normal</button>
            <button id="hardBtn">Hard</button>
            <button id="ultraBtn">Ultra</button>
        </div>

        <button id="restartBtn">Restart</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
